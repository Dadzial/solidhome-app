<!-- Kontener stopki -->
<footer class="flex items-center justify-between p-6 shrink-0 relative z-10">
  <!-- Przycisk językowy -->
  <app-lang-button />
  <!-- Komunikat o braku połączenia z płytką -->
  @if (showStatus()) {
    <span
      class="absolute left-1/2 -translate-x-1/2 h-10 px-4 flex items-center justify-center bg-background-secondary shadow-2xl rounded-3xl text-body-16-medium text-center pointer-events-none"
      [class.text-text-success]="isBoardOnline()"
      [class.text-text-error]="!isBoardOnline()"
    >
      {{ (isBoardOnline() ? 'footer.boardOnline' : 'footer.boardOffline') | translate }}
    </span>
  }
  <!-- Przycisk motywu -->
  <app-theme-button />
</footer>
