<div class="w-full min-h-screen lg:h-screen lg:overflow-hidden flex flex-col bg-background-primary">
  <!-- Navbar -->
  <app-navbar class="shrink-0"></app-navbar>
  <!-- Zawartość strony -->
  <div class="flex-1 px-6 p-6 pb-0 flex flex-col relative z-10 min-h-0">
    <div class="flex flex-row gap-3 mb-4 shrink-0">
      <h2 class="text-text-primary text-headline-h1-36-bold text-shadow-2xs">
        {{ 'airPage.title' | translate }}
      </h2>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:flex-1 min-h-0">
      <!-- Kafelki odczytów wewnętrznych z czujnika-->
      <div class="col-span-1 flex flex-col gap-4 sm:gap-6 min-h-0 lg:h-full">
        <app-temperature-display class="block lg:flex-1 min-h-0"></app-temperature-display>
        <app-pressure-display class="block lg:flex-1 min-h-0"></app-pressure-display>
        <app-humidity-display class="block lg:flex-1 min-h-0"></app-humidity-display>
      </div>
      <!-- Historia i wykresy pomiarów -->
      <div class="col-span-1 block lg:h-full min-h-0">
        <app-air-charts class="block h-full"></app-air-charts>
      </div>
      <!-- Pogoda zewnętrzna -->
      <div class="col-span-1 block lg:h-full min-h-0">
        <app-outside-data class="block h-full"></app-outside-data>
      </div>
    </div>
  </div>
  <!-- Stopka -->
  <app-footer></app-footer>
</div>
