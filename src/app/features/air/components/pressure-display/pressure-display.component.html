<div
  class="@container w-full h-full p-4 max-md:p-4 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative"
>
  <div class="flex flex-row items-center justify-between mb-4 max-md:mb-3">
    <div class="flex items-center gap-2">
      <svg-icon
        src="assets/icons/pressure.svg"
        [applyClass]="true"
        class="w-8 h-8 text-accent"
      ></svg-icon>
      <h2
        class="text-text-primary pt-0.5 text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs"
      >
        {{ 'pressureDisplay.title' | translate }}
      </h2>
    </div>
  </div>

  <!-- Główny odczyt -->
  <div
    class="flex items-baseline gap-1 my-auto transition-opacity duration-300"
    [class.opacity-50]="!airDataService.isBoardOnline()"
  >
    <span
      class="text-headline-h1-36-bold text-text-primary leading-none"
      [class.!font-normal]="airDataService.pressure() === null"
    >
      {{ airDataService.pressure() !== null ? airDataService.pressure() : '--' }}
    </span>
    <span class="text-body-24-semibold text-text-primary/50 leading-none">hPa</span>
  </div>

  <!-- Status -->
  <div
    class="text-body-12-regular text-accent transition-opacity duration-300"
    [class.opacity-50]="!airDataService.isBoardOnline()"
  >
    {{ pressureStatusKey() | translate }}
  </div>
</div>
