<div class="w-full h-full p-6 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative">
  @if (hasError()) {
    <div class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-background-secondary/40 backdrop-blur-md rounded-3xl p-6 text-center">
      <svg-icon src="assets/icons/error.svg" [applyClass]="true" class="w-12 h-12 text-text-error mb-2"></svg-icon>
      <h2 class="text-text-primary text-body-18-semibold text-shadow-sm" [innerHTML]="'home.lightsWidget.lightsError' | translate"></h2>
    </div>
  }
  <div class="flex flex-row items-center gap-2 mb-4">
    <svg-icon src="assets/icons/light_bulb.svg" [applyClass]="true" class="w-9 h-9 text-accent"></svg-icon>
    <h2 class="text-text-primary text-headline-h2-28-bold text-shadow-2xs pt-0.5">{{ titleKey() | translate }}</h2>
  </div>

  <div class="flex-3 w-full relative rounded-2xl overflow-hidden">
    <img ngSrc="assets/pictures/home_preview.png" alt="Preview" fill class="object-cover scale-[1]" />

    @for (light of lights(); track light.id) {
      <button (click)="toggleLight(light.id)"
              class="absolute p-2 rounded-full backdrop-blur-md transition-all duration-300 border border-white/20 hover:scale-110 active:scale-95"
              [style.top]="light.top"
              [style.left]="light.left"
              [ngClass]="{'bg-accent shadow-[0_0_15px_rgba(255,255,255,0.5)]': light.on, 'bg-white/30 shadow-md': !light.on}">
        <svg-icon src="assets/icons/light_bulb.svg" [applyClass]="true" class="w-6 h-6 text-white transition-colors"></svg-icon>
      </button>
    }
  </div>
  <div class="bg-accent -mx-6 h-1 opacity-10"></div>
  <div class="flex-1 w-full pt-3 flex flex-col">
    <div class="flex flex-row items-center gap-2 mb-3">
      <svg-icon src="assets/icons/history_of_use.svg" [applyClass]="true" class="w-9 h-9 text-accent"></svg-icon>
      <div class="text-text-primary text-body-18-bold">{{ 'home.lightsWidget.history' | translate }}</div>
    </div>
    
    <div class="flex flex-col gap-2 overflow-y-auto pr-2 max-h-[140px]">
      @for (item of history(); track item.id) {
        <div class="flex items-center justify-between p-3 rounded-xl bg-background-primary hover:brightness-95 dark:hover:brightness-110 transition-all">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full flex items-center justify-center transition-colors" 
                 [ngClass]="item.action === 'ON' ? 'bg-accent/20 text-accent' : 'bg-text-secondary/10 text-text-primary/50'">
              <svg-icon src="assets/icons/light_bulb.svg" [applyClass]="true" class="w-5 h-5"></svg-icon>
            </div>
            <div class="flex flex-col">
              <span class="text-body-16-semibold text-text-primary">{{ item.name }}</span>
              <span class="text-body-14-medium text-text-primary/60">
                Switched <span [ngClass]="item.action === 'ON' ? 'text-accent font-bold' : 'font-bold'">{{ item.action }}</span>
              </span>
            </div>
          </div>
          <span class="text-body-12-regular text-text-primary/50">{{ item.time }}</span>
        </div>
      }
    </div>
  </div>
</div>
