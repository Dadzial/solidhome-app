<div
  class="@container w-full h-full p-4 max-md:p-4 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative">
  <!-- Nagłówek Energy — tytuł -->
  <div class="flex flex-col mb-2 max-md:mb-3 gap-3">
    <div class="flex flex-row items-center justify-between">
      <div class="flex items-center gap-2">
        <svg-icon src="assets/icons/light_energy.svg" [applyClass]="true" class="w-8 h-8 text-accent"></svg-icon>
        <h2 class="text-text-primary text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.energy' | translate }}
        </h2>
      </div>
    </div>

    <!-- Wiersz dla opcji Dropdown -->
    <div class="flex items-center gap-2 flex-wrap relative">

      <!-- Dropdown: Okres czasu -->
      <div class="relative flex-1 min-w-32.5">
        <button
          type="button"
          (click)="toggleDropdown('timeframe')"
          class="w-full flex items-center justify-between bg-background-primary text-text-primary text-body-14-medium px-3.5 py-2.5 rounded-2xl cursor-pointer">
          <span>{{ selectedTimeframeLabel() | translate }}</span>
          <svg-icon
            src="assets/icons/down_arrow.svg"
            [applyClass]="true"
            class="w-4 h-4 text-text-primary transition-transform duration-200"
            [class.rotate-90]="activeDropdown() === 'timeframe'">
          </svg-icon>
        </button>

        @if (activeDropdown() === 'timeframe') {
          <div
            class="absolute top-full left-0 right-0 mt-2 bg-background-primary rounded-2xl shadow-xl p-1.5 z-50 flex flex-col gap-1">
            @for (option of timeframeOptions; track option.value) {
              <button
                type="button"
                (click)="selectTimeframe(option.value)"
                class="w-full text-left px-3 py-2 rounded-xl text-body-14-medium transition-colors cursor-pointer"
                [class.text-accent]="selectedTimeframe() === option.value"
                [class.text-text-primary]="selectedTimeframe() !== option.value"
                [class.hover:text-accent]="selectedTimeframe() !== option.value">
                {{ option.labelKey | translate }}
              </button>
            }
          </div>
        }
      </div>

      <!-- Dropdown: Pomieszczenie -->
      <div class="relative flex-1 min-w-32.5">
        <button
          type="button"
          (click)="toggleDropdown('room')"
          class="w-full flex items-center justify-between bg-background-primary text-text-primary text-body-14-medium px-3.5 py-2.5 rounded-2xl cursor-pointer">
          <span>{{ selectedRoomLabel() | translate }}</span>
          <svg-icon
            src="assets/icons/down_arrow.svg"
            [applyClass]="true"
            class="w-4 h-4 text-text-primary transition-transform duration-200"
            [class.rotate-90]="activeDropdown() === 'room'">
          </svg-icon>
        </button>

        @if (activeDropdown() === 'room') {
          <div
            class="absolute top-full left-0 right-0 mt-2 bg-background-primary rounded-2xl shadow-xl p-1.5 z-50 flex flex-col">
            @for (option of roomOptions; track option.value) {
              <button
                type="button"
                (click)="selectRoom(option.value)"
                class="w-full text-left px-3 py-2 rounded-xl text-body-14-medium transition-colors cursor-pointer"
                [class.text-accent]="selectedRoom() === option.value"
                [class.text-text-primary]="selectedRoom() !== option.value"
                [class.hover:text-accent]="selectedRoom() !== option.value">
                {{ option.labelKey | translate }}
              </button>
            }
          </div>
        }
      </div>
    </div>
    <!-- Wiersz dla wykresu -->
    <div class="flex-1 mt-2 bg-background-primary rounded-2xl flex flex-col">
      <apx-chart
        [series]="chartOptions.series!"
        [chart]="chartOptions.chart!"
        [xaxis]="chartOptions.xaxis!"
        [yaxis]="chartOptions.yaxis!"
        [grid]="chartOptions.grid!"
        [stroke]="chartOptions.stroke!"
        [dataLabels]="chartOptions.dataLabels!"
        [colors]="chartOptions.colors!"
        [tooltip]="chartOptions.tooltip!">
      </apx-chart>
    </div>
    <!-- Wiersz dla podsumowania największego zużycia -->
    <div class="flex flex-col mt-2">
      <div class="flex items-center justify-between">
        <span class="text-text-primary text-body-18-bold">{{ 'lightsPage.greatestConsumption' | translate }}</span>
      </div>
    </div>
  </div>
</div>
