<div
  class="@container w-full h-full p-4 max-md:p-4 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative">
  <!-- Nagłówek Energy — tytuł -->
  <div class="flex flex-col mb-4 max-md:mb-3 gap-3">
    <div class="flex flex-row items-center justify-between">
      <div class="flex items-center gap-2">
        <svg-icon src="assets/icons/light_energy.svg" [applyClass]="true" class="w-8 h-8 text-accent"></svg-icon>
        <h2 class="text-text-primary text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.energy' | translate }}
        </h2>
      </div>
    </div>
    <!-- Wiersz dla opcji Dropdown -->
    <div class="flex items-center gap-2 flex-wrap relative">
      <!-- Dropdown Okres czasu -->
      <div class="relative flex-1 min-w-32.5">
        <button
          type="button"
          (click)="toggleTimeframeDropdown()"
          class="w-full flex items-center justify-between bg-background-primary text-text-primary text-body-14-medium px-3.5 py-2.5 rounded-2xl cursor-pointer leading-1">
          <span>{{ 'lightsPage.' + selectedTimeframe() | translate }}</span>
          <svg-icon
            src="assets/icons/down_arrow.svg"
            [applyClass]="true"
            [class]="isTimeframeOpen() ? 'w-4 h-4 text-text-primary transition-transform duration-200 rotate-90' : 'w-4 h-4 text-text-primary transition-transform duration-200'">
          </svg-icon>
        </button>
        @if (isTimeframeOpen()) {
          <div
            class="absolute top-full left-0 right-0 mt-2 bg-background-primary rounded-2xl shadow-xl p-1.5 z-50 flex flex-col gap-1">
            @for (option of timeframeOptions; track option.value) {
              <button
                type="button"
                (click)="selectTimeframe(option.value)"
                [class]="selectedTimeframe() === option.value ? 'w-full text-left px-3 py-2 rounded-xl text-body-14-medium text-accent transition-colors cursor-pointer' : 'w-full text-left px-3 py-2 rounded-xl text-body-14-medium text-text-primary hover:text-accent transition-colors cursor-pointer'">
                {{ option.labelKey | translate }}
              </button>
            }
          </div>
        }
      </div>
      <!-- Dropdown Pomieszczenie -->
      <div class="relative flex-1 min-w-32.5">
        <div
          class="w-full flex items-center justify-between bg-background-primary text-text-primary text-body-14-medium px-3.5 py-2.5 rounded-2xl cursor-pointer leading-1">
          <span>Cały dom</span>
          <svg-icon src="assets/icons/down_arrow.svg" [applyClass]="true" class="w-4 h-4 text-text-primary"></svg-icon>
        </div>
      </div>
    </div>
  </div>
</div>
