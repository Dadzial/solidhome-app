<div
  class="@container w-full h-full p-4 max-md:p-4 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative overflow-hidden transition-all">
  @if (enableAddSchedule()) {
    <!-- Przestrzeń formularza dodania reguły aktywowana przez signal 'enableAddSchedule' -->
    <div class="flex flex-col h-full min-h-0 animate-fade-in">
      <div class="flex flex-row items-center justify-between mb-4 max-md:mb-3 shrink-0">
        <h2 class="text-text-primary text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.addRule' | translate }}
        </h2>
        <!-- Przycisk zamknięcia formularza -->
        <button
          (click)="toggleAddSchedule()"
          class="w-8 h-8 flex items-center justify-center rounded-full text-text-primary/50 hover:text-accent hover:bg-background-tertiary transition-colors cursor-pointer">
          <svg-icon src="assets/icons/close.svg" [applyClass]="true" class="w-9 h-9"></svg-icon>
        </button>
      </div>

      <!-- Kontener na elementy formularza dodawania reguły -->
      <div class="flex-1 min-h-0 overflow-y-auto rounded-scrollbar pr-1 flex flex-col gap-3">
        <!-- Pole tekstowe do wprowadzania nazwy reguły -->
        <div class="flex flex-col gap-1.5">
          <label class="text-text-primary text-body-16-medium">
            {{ 'lightsPage.ruleName' | translate }}
          </label>
          <input
            type="text"
            placeholder="{{ 'lightsPage.ruleNamePlaceholder' | translate }}"
            class="w-full px-4.5 py-3 bg-background-primary text-text-primary text-body-14-medium rounded-2xl focus:outline-none transition-all"
          />
        </div>
        <!-- Wybór dni tygodnia dla reguły -->
        <div class="flex flex-col gap-1.5">
          <label class="text-text-primary text-body-14-medium">
            {{ 'lightsPage.ruleActiveDays' | translate }}
          </label>
          <div class="grid grid-cols-7 gap-1.5 w-full">
            @for (key of weekDayKeys; track $index) {
              <button
                type="button"
                (click)="toggleDay($index)"
                class="w-full py-2.5 flex items-center justify-center rounded-2xl text-body-12-medium transition-all cursor-pointer select-none"
                [class.bg-accent]="isDaySelected($index)"
                [class.text-white]="isDaySelected($index)"
                [class.shadow-sm]="isDaySelected($index)"
                [class.bg-background-primary]="!isDaySelected($index)"
                [class.text-text-primary]="!isDaySelected($index)"
                [class.opacity-60]="!isDaySelected($index)"
                [class.hover:opacity-100]="!isDaySelected($index)"
                [class.hover:bg-background-tertiary]="!isDaySelected($index)">
                {{ key | translate }}
              </button>
            }
          </div>
        </div>
        <!-- Wybór godziny aktywacji i dezaktywacji reguły -->
        <div class="flex flex-col gap-1.5">

        </div>
        <!-- Przycisk zapisu reguły -->

      </div>
    </div>
  } @else {
    <!-- Nagłówek Schedule — tytuł i przycisk dodawania -->
    <div class="flex flex-row items-center justify-between mb-4 max-md:mb-3">
      <div class="flex items-center gap-2">
        <svg-icon src="assets/icons/light_schedule.svg" [applyClass]="true" class="w-8 h-8 text-accent"></svg-icon>
        <h2
          class="text-text-primary text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.rules' | translate }}
        </h2>
      </div>
      <!-- Przycisk dodawania reguły -->
      <button
        (click)="toggleAddSchedule()"
        class="bg-accent h-8 p-2 rounded-lg text-body-14-medium text-text-primary transition-all active:scale-95 cursor-pointer">
        {{ 'lightsPage.add' | translate }}
      </button>
    </div>
    <!-- Tutaj w przyszłości lista istniejących reguł -->
  }
</div>
