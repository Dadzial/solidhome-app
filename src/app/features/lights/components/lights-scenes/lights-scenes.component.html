<div
  class="@container w-full h-full p-4 max-md:p-4 flex flex-col bg-background-secondary rounded-3xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative overflow-hidden transition-all">
  @if (enableAddScene()) {
    <!-- Przestrzeń dodania sceny aktywowana przez signal 'enableAddScene' -->
    <div class="flex flex-col h-full min-h-0 animate-fade-in">
      <div class="flex flex-row items-center justify-between mb-4 max-md:mb-3 shrink-0">
        <h2 class="text-text-primary text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.addScene' | translate }}
        </h2>
        <!-- Przycisk zamknięcia formularza -->
        <button
          (click)="toggleAddScene()"
          class="w-8 h-8 flex items-center justify-center rounded-full text-text-primary/50 hover:text-accent hover:bg-background-tertiary transition-colors cursor-pointer">
          <svg-icon src="assets/icons/close.svg" [applyClass]="true" class="w-9 h-9"></svg-icon>
        </button>
      </div>

      <!-- Kontener na elementy formularza dodawania sceny-->
      <div class="flex-1 min-h-0 flex flex-col gap-3 pr-1 overflow-y-auto rounded-scrollbar">
        <!-- Pole tekstowe do wprowadzania nazwy sceny -->
        <div class="flex flex-col gap-1.5">
          <label class="text-text-primary text-body-16-medium">
            {{ 'lightsPage.sceneName' | translate }}
          </label>
          <input
            type="text"
            placeholder="{{ 'lightsPage.sceneNamePlaceholder' | translate }}"
            class="w-full px-4.5 py-2 bg-background-primary text-text-primary text-body-14-medium rounded-2xl focus:outline-none transition-all"
          />
        </div>
        <!-- Ikona reprezentująca scenę -->
        <div class="flex flex-col gap-1.5">
          <label class="text-text-primary text-body-16-medium">
            {{ 'lightsPage.sceneIcon' | translate }}
          </label>
          <div class="flex flex-wrap gap-2 w-full">
            @for (icon of sceneIcons; track icon) {
              <button
                type="button"
                (click)="selectIcon(icon)"
                class="w-9 h-9 p-0 flex items-center justify-center rounded-2xl transition-all cursor-pointer select-none text-text-primary"
                [class.bg-accent]="selectedIcon() === icon"
                [class.text-white]="selectedIcon() === icon"
                [class.shadow-sm]="selectedIcon() === icon"
                [class.bg-background-primary]="selectedIcon() !== icon"
                [class.text-text-primary70]="selectedIcon() !== icon"
                [class.hover:bg-background-tertiary]="selectedIcon() !== icon"
                [class.hover:text-text-primary]="selectedIcon() !== icon"><svg-icon [src]="icon" [applyClass]="true" class="w-5 h-5 flex items-center justify-center"></svg-icon></button>
            }
          </div>
        </div>
        <!-- Wybór pokoi, w których scena będzie aktywna -->
        <div class="flex flex-col gap-1.5">
          <label class="text-text-primary text-body-16-medium">
            {{ 'lightsPage.ruleActiveRooms' | translate }}
          </label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 w-full">
            @for (option of roomOptions; track option.value) {
              <button
                type="button"
                (click)="toggleRoom(option.value)"
                class="w-full py-1.5 px-2 flex items-center justify-center rounded-xl text-body-12-medium transition-all cursor-pointer select-none truncate"
                [class.bg-accent]="isRoomSelected(option.value)"
                [class.text-white]="isRoomSelected(option.value)"
                [class.bg-background-primary]="!isRoomSelected(option.value)"
                [class.text-text-primary]="!isRoomSelected(option.value)"
                [class.opacity-60]="!isRoomSelected(option.value)"
                [class.hover:opacity-100]="!isRoomSelected(option.value)">
                {{ option.labelKey | translate }}
              </button>
            }
          </div>
        </div>
        <!-- Przycisk zapisu sceny -->
        <button
          type="button"
          class="mt-auto bg-accent h-8 p-2 rounded-lg text-body-14-medium text-text-primary transition-all cursor-pointer shrink-0">
          {{ 'lightsPage.save' | translate }}
        </button>
      </div>
    </div>
  } @else {
    <!-- Nagłówek Scenes — tytuł i przycisk dodawania -->
    <div class="flex flex-row items-center justify-between mb-4 max-md:mb-3">
      <div class="flex items-center gap-2">
        <svg-icon src="assets/icons/light_scenes.svg" [applyClass]="true" class="w-8 h-8 text-accent"></svg-icon>
        <h2
          class="text-text-primary pt-0.5 text-headline-h2-28-bold max-md:text-body-24-bold text-shadow-2xs">
          {{ 'lightsPage.scenes' | translate }}
        </h2>
      </div>
      <!-- Przycisk dodawania sceny -->
      <button
        (click)="toggleAddScene()"
        class="bg-accent h-8 p-2 rounded-lg text-body-14-medium text-text-primary transition-all active:scale-95 cursor-pointer">
        {{ 'lightsPage.add' | translate }}
      </button>
    </div>
    <!-- Tutaj w przyszłości lista istniejących scen -->
  }
</div>
